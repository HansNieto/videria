<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>04 — Límite de autoridad</title>
<link rel="stylesheet" href="./lib/overlay.css">
</head>
<body>
<!-- Frase 4: "…qué puede decidir cada persona sin pedir permiso y hasta qué límite."
     Estilo 3D suave: masa con volumen; el límite es una barra de 10px, no una línea. -->
<div id="stage" class="s-soft3d">
  <svg class="canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <g class="frame pos-center">
      <g class="module" transform="translate(960,619) scale(1.92)">

        <!-- dueño, arriba del límite -->
        <g class="at" transform="translate(165,-205) scale(1.05)">
          <g class="o owner">
            <circle class="solid" cx="0" cy="-34" r="18"/>
            <ellipse class="spec" cx="-7" cy="-41" rx="9" ry="6"/>
            <path class="solid accent" d="M-28,31 V22 A28,28 0 0 1 28,22 V31 Z"/>
          </g>
        </g>

        <!-- el límite -->
        <g class="o limit">
          <path id="lim" class="rail limline" d="M-280,-30 H280"/>
        </g>
        <g class="at" transform="translate(-280,-56)">
          <g class="o limtag"><text class="tag t-warn">LÍMITE</text></g>
        </g>

        <!-- empleado -->
        <g class="at" transform="translate(-175,68) scale(1.3)">
          <g class="o employee">
            <circle class="solid" cx="0" cy="-32" r="16"/>
            <ellipse class="spec" cx="-6" cy="-38" rx="8" ry="5"/>
            <path class="solid" d="M-25,29 V21 A25,25 0 0 1 25,21 V29 Z"/>
          </g>
        </g>

        <!-- decisiones pequeñas: se resuelven sin pedir permiso -->
        <g class="at" transform="translate(-70,152)">
          <g class="o small s1">
            <circle class="solid glass" r="26"/>
            <ellipse class="spec" cx="-8" cy="-11" rx="12" ry="7"/>
            <circle class="solid ok okdisc" r="26"/>
            <path class="ckmark ck" d="M-11,0 L-3,9 L12,-9"/>
          </g>
        </g>
        <g class="at" transform="translate(20,152)">
          <g class="o small s2">
            <circle class="solid glass" r="26"/>
            <ellipse class="spec" cx="-8" cy="-11" rx="12" ry="7"/>
            <circle class="solid ok okdisc" r="26"/>
            <path class="ckmark ck" d="M-11,0 L-3,9 L12,-9"/>
          </g>
        </g>
        <g class="at" transform="translate(110,152)">
          <g class="o small s3">
            <circle class="solid glass" r="26"/>
            <ellipse class="spec" cx="-8" cy="-11" rx="12" ry="7"/>
            <circle class="solid ok okdisc" r="26"/>
            <path class="ckmark ck" d="M-11,0 L-3,9 L12,-9"/>
          </g>
        </g>

        <!-- decisión grande: supera el límite -->
        <g class="at" transform="translate(195,152)">
          <g class="o big">
            <circle class="solid accent bigdisc" r="36"/>
            <ellipse class="spec" cx="-12" cy="-15" rx="17" ry="11"/>
            <rect class="solid" x="-15" y="-7" width="30" height="5" rx="2.5"/>
            <rect class="solid" x="-15" y="3"  width="20" height="5" rx="2.5"/>
          </g>
        </g>

      </g>
    </g>
  </svg>
</div>

<style>
  .ckmark  { fill: none; stroke: #FFFFFF; stroke-width: 6;
             stroke-linecap: round; stroke-linejoin: round; }
  .limline { stroke: #FFB020; stroke-width: 10; }
</style>

<script src="./lib/gsap.min.js"></script>
<script src="./lib/CustomEase.min.js"></script>
<script src="./lib/DrawSVGPlugin.min.js"></script>
<script src="./lib/overlay.js"></script>
<script>
/* Entra en "cada" · sale tras "límite" */
const BEATS = {
  in:   0.00,   // "cada persona"
  lim:  0.50,
  s1:   0.95,   // "sin pedir permiso"
  s2:   1.20,
  s3:   1.45,
  big:  2.31,   // "hasta qué límite"
  hit:  2.90,   // la decisión grande toca el límite
  up:   3.20,   // escala al dueño
  peak: 3.80,
  exit: 4.30
};

Overlay.scene({
  id: '04_limite_de_autoridad',
  build(tl) {
    gsap.set('.o', { autoAlpha: 0 });
    gsap.set('.ck, .okdisc', { autoAlpha: 0 });

    /* ENTRADA — quién decide y dónde está la raya */
    tl.fromTo('.employee', { autoAlpha: 0, y: 20, scale: .92 },
                           { autoAlpha: 1, y: 0, scale: 1, duration: .5 }, BEATS.in)
      .set('.limit', { autoAlpha: 1 }, BEATS.lim)
      .fromTo('#lim', { drawSVG: '0% 0%' },
                      { drawSVG: '0% 100%', duration: .6, ease: 'power2.inOut' }, BEATS.lim)
      /* el punteado se aplica al terminar el trazado (drawSVG usa el dasharray) */
      .set('#lim', { strokeDasharray: '20 18' }, BEATS.lim + .62)
      .fromTo('.limtag', { autoAlpha: 0, x: -12 },
                         { autoAlpha: 1, x: 0, duration: .4 }, BEATS.lim + .25);

    /* DESARROLLO — lo pequeño se resuelve abajo, sin cruzar */
    [['s1', BEATS.s1], ['s2', BEATS.s2], ['s3', BEATS.s3]].forEach(([s, t]) => {
      tl.fromTo('.' + s, { autoAlpha: 0, y: 24, scale: .7 },
                         { autoAlpha: 1, y: -92, scale: 1, duration: .58, ease: "brand" }, t)
        .to('.' + s + ' .okdisc', { autoAlpha: 1, duration: .28 }, t + .52)
        .to('.' + s + ' .ck', { autoAlpha: 1, duration: .28, ease: 'settle' }, t + .57);
    });

    /* la grande sube y choca con el límite */
    tl.fromTo('.big', { autoAlpha: 0, y: 26, scale: .78 },
                      { autoAlpha: 1, y: -218, scale: 1, duration: .66, ease: 'power2.out' },
                      BEATS.big)
      .to('#lim', { scaleY: 1.9, transformOrigin: '50% 50%',
                    duration: .12, yoyo: true, repeat: 1, ease: 'power2.out' }, BEATS.hit)
      .to('.big', { y: -196, duration: .2, ease: 'power2.out' }, BEATS.hit + .06);

    /* CLÍMAX — escala al dueño: eso es entregar autoridad */
    tl.to('.big', { x: -30, y: -274, duration: .66, ease: 'power2.inOut' }, BEATS.up)
      .fromTo('.owner', { autoAlpha: 0, y: -16, scale: .9 },
                        { autoAlpha: 1, y: 0, scale: 1, duration: .5, ease: 'settle' },
                        BEATS.up + .14)
      .to('.owner', { scale: 1.05, duration: .18, yoyo: true, repeat: 1,
                      ease: 'power2.out' }, BEATS.peak)
      .to('.big', { scale: .9, duration: .18, yoyo: true, repeat: 1,
                    ease: 'power2.out' }, BEATS.peak);

    /* SALIDA — lo resuelto se contrae, lo que subió se va con el dueño */
    tl.to('.small',    { autoAlpha: 0, scale: .8, duration: .28, ease: 'swift',
                         stagger: .04 }, BEATS.exit)
      .to('.employee', { autoAlpha: 0, y: 12, duration: .3, ease: 'swift' }, BEATS.exit + .05)
      .to('.limtag',   { autoAlpha: 0, x: -10, duration: .26, ease: 'swift' }, BEATS.exit + .06)
      .to('.limit',    { autoAlpha: 0, scaleX: .92, transformOrigin: '50% 50%',
                         duration: .3, ease: 'swift' }, BEATS.exit + .08)
      .to('.big',      { autoAlpha: 0, scale: .82, y: '-=18',
                         duration: .3, ease: 'swift' }, BEATS.exit + .12)
      .to('.owner',    { autoAlpha: 0, scale: .93, y: -12,
                         duration: .32, ease: 'swift' }, BEATS.exit + .16);
  }
});
</script>
</body>
</html>
