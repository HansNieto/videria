<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>06 — Dinero mezclado</title>
<link rel="stylesheet" href="./lib/overlay.css">
</head>
<body>
<!-- "Hoy entran quinientos soles, sacas cien para una compra personal;
     mañana otros cincuenta…"
     Metáfora: la caja del negocio alimenta la billetera personal y el saldo
     deja de significar algo. La pausa de "para una compra personal" NO se rellena. -->
<div id="stage" class="s-soft3d">
  <svg class="canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <g class="frame pos-center">
      <g class="module" transform="translate(960,608) scale(2.14)">

        <!-- caja del negocio -->
        <g class="at" transform="translate(-160,0)">
          <g class="o box">
            <rect class="solid" x="-130" y="-58" width="260" height="146" rx="22"/>
            <rect class="solid glass" x="-138" y="-80" width="276" height="28" rx="14"/>
            <rect class="slot" x="-30" y="-73" width="60" height="9" rx="4.5"/>
            <ellipse class="spec" cx="-56" cy="-40" rx="52" ry="16"/>
            <rect class="solid dark" x="-76" y="2" width="152" height="46" rx="11"/>
            <rect class="solid glass" x="-116" y="58" width="232" height="26" rx="11"/>
            <rect class="slot" x="-26" y="66" width="52" height="8" rx="4"/>
            <text class="num sm bal" y="36" text-anchor="middle"
                  style="font-size:40px">S/0</text>
          </g>
        </g>

        <!-- billetera personal -->
        <g class="at" transform="translate(185,30)">
          <g class="o wallet">
            <rect class="solid glass" x="-58" y="-74" width="116" height="26" rx="7"/>
            <rect class="solid" x="-85" y="-58" width="170" height="116" rx="18"/>
            <ellipse class="spec" cx="-32" cy="-38" rx="34" ry="12"/>
            <rect class="solid accent" x="-85" y="-4" width="170" height="52" rx="18"/>
            <circle class="solid gold" cx="52" cy="22" r="13"/>
          </g>
        </g>

        <!-- etiquetas -->
        <g class="at" transform="translate(-160,118)">
          <g class="o lb1"><text class="tag" text-anchor="middle">NEGOCIO</text></g>
        </g>
        <g class="at" transform="translate(185,118)">
          <g class="o lb2"><text class="tag" text-anchor="middle">PERSONAL</text></g>
        </g>

        <!-- cifras -->
        <g class="at" transform="translate(-160,-128)">
          <g class="o f-in"><text class="num xs t-ok" text-anchor="middle">+S/500</text></g>
        </g>
        <g class="at" transform="translate(185,-74)">
          <g class="o f-o1"><text class="num xs t-warn" text-anchor="middle">−S/100</text></g>
        </g>
        <g class="at" transform="translate(185,-74)">
          <g class="o f-o2"><text class="num xs t-warn" text-anchor="middle">−S/50</text></g>
        </g>

        <!-- monedas -->
        <g class="at" transform="translate(-160,-160)">
          <g class="o coin c0">
            <circle class="solid gold" r="32"/>
            <ellipse class="spec" cx="-8" cy="-11" rx="12" ry="8"/>
            <text class="tag t-ink" y="8" text-anchor="middle" style="font-size:26px">S/</text>
          </g>
        </g>
        <g class="at" transform="translate(-160,-14)">
          <g class="o coin c1">
            <circle class="solid gold" r="30"/>
            <ellipse class="spec" cx="-8" cy="-10" rx="11" ry="7"/>
            <text class="tag t-ink" y="8" text-anchor="middle" style="font-size:24px">S/</text>
          </g>
        </g>
        <g class="at" transform="translate(-160,-14)">
          <g class="o coin c2">
            <circle class="solid gold" r="26"/>
            <ellipse class="spec" cx="-7" cy="-9" rx="10" ry="6"/>
            <text class="tag t-ink" y="7" text-anchor="middle" style="font-size:21px">S/</text>
          </g>
        </g>

      </g>
    </g>
  </svg>
</div>

<style>
  .slot { fill: rgba(11,18,32,.55); stroke: none; }
  .bal  { fill: #FFFFFF; font-variant-numeric: tabular-nums; }
</style>

<script src="./lib/gsap.min.js"></script>
<script src="./lib/CustomEase.min.js"></script>
<script src="./lib/overlay.js"></script>
<script>
/* "Hoy(1) entran(2) quinientos(3) soles(4), sacas(5) cien(6) para(7) una(8)
    compra(9) personal(10); mañana(11) otros(12) cincuenta(13)"
   Entra en "Hoy" · sale ~0,6 s después de "cincuenta" */
const BEATS = {
  in:   0.00,   // "Hoy entran"
  cash: 0.77,   // "quinientos"            ← entra el dinero
  out1: 1.92,   // "cien"                  ← sale a la billetera
  // 2.31 → 3.85  "para una compra personal": pausa. No entra nada nuevo.
  out2: 3.85,   // "mañana otros cincuenta"
  blur: 4.85,   // el saldo deja de significar algo
  exit: 5.45
};

Overlay.scene({
  id: '06_dinero_mezclado',
  build(tl, ctx) {
    gsap.set('.o', { autoAlpha: 0 });
    const bal = ctx.q('.bal');
    const v = { n: 0 };
    const write = () => bal.textContent = 'S/' + Math.round(v.n);

    /* ENTRADA — la caja del negocio y la billetera personal */
    tl.fromTo('.box', { autoAlpha: 0, y: 22, scale: .95 },
                      { autoAlpha: 1, y: 0, scale: 1, duration: .55 }, BEATS.in)
      .fromTo('.lb1', { autoAlpha: 0, y: 10 },
                      { autoAlpha: 1, y: 0, duration: .4 }, BEATS.in + .18)
      .fromTo('.wallet', { autoAlpha: 0, y: 22, scale: .95 },
                         { autoAlpha: .55, y: 0, scale: 1, duration: .5 }, BEATS.in + .12)
      .fromTo('.lb2', { autoAlpha: 0, y: 10 },
                      { autoAlpha: .55, y: 0, duration: .4 }, BEATS.in + .26);

    /* +S/500 — la moneda cae por la ranura y el saldo sube */
    tl.fromTo('.c0', { autoAlpha: 0, y: -34, scale: .8 },
                     { autoAlpha: 1, y: 0, scale: 1, duration: .3, ease: 'power2.in' }, BEATS.cash)
      .to('.c0', { y: 96, scale: .7, duration: .26, ease: 'power2.in' }, BEATS.cash + .3)
      .to('.c0', { autoAlpha: 0, duration: .12 }, BEATS.cash + .48)
      .to('.box', { scale: 1.03, duration: .18, yoyo: true, repeat: 1,
                    ease: 'power2.out' }, BEATS.cash + .5)
      .to(v, { n: 500, duration: .7, ease: 'power2.out', onUpdate: write }, BEATS.cash + .5)
      .fromTo('.f-in', { autoAlpha: 0, y: 14, scale: .9 },
                       { autoAlpha: 1, y: 0, scale: 1, duration: .4, ease: 'settle' },
                       BEATS.cash + .5)
      .to('.f-in', { autoAlpha: 0, y: -22, duration: .4, ease: 'power2.in' }, BEATS.cash + 1.15);

    /* −S/100 — sale del negocio y entra en lo personal */
    tl.to('.c1', { autoAlpha: 1, duration: .12 }, BEATS.out1)
      .to('.c1', { keyframes: [
              { x: 175, y: -104, scale: 1.08, rotation: 8, duration: .36, ease: "power2.out" },
              { x: 345, y: 44,  scale: .55, rotation: 16, duration: .4, ease: "power2.in" }
            ] }, BEATS.out1)
      .to('.c1', { autoAlpha: 0, duration: .14 }, BEATS.out1 + .68)
      .to(v, { n: 400, duration: .5, ease: 'power2.out', onUpdate: write }, BEATS.out1 + .6)
      .to('.wallet', { autoAlpha: 1, duration: .3 }, BEATS.out1 + .66)
      .to('.lb2', { autoAlpha: 1, duration: .3 }, BEATS.out1 + .66)
      .to('.wallet', { scale: 1.05, duration: .18, yoyo: true, repeat: 1,
                       ease: 'power2.out' }, BEATS.out1 + .72)
      .fromTo('.f-o1', { autoAlpha: 0, y: 12 },
                       { autoAlpha: 1, y: 0, duration: .32, ease: 'settle' }, BEATS.out1 + .7)
      .to('.f-o1', { autoAlpha: 0, y: -18, duration: .35, ease: 'power2.in' }, BEATS.out1 + 1.3);

    /* PAUSA — "para una compra personal": no entra nada nuevo */

    /* −S/50 — al día siguiente, otra vez */
    tl.to('.c2', { autoAlpha: 1, duration: .12 }, BEATS.out2)
      .to('.c2', { keyframes: [
              { x: 175, y: -90, scale: 1.06, rotation: -7, duration: .34, ease: "power2.out" },
              { x: 345, y: 44, scale: .55, rotation: -14, duration: .38, ease: "power2.in" }
            ] }, BEATS.out2)
      .to('.c2', { autoAlpha: 0, duration: .14 }, BEATS.out2 + .64)
      .to(v, { n: 350, duration: .45, ease: 'power2.out', onUpdate: write }, BEATS.out2 + .58)
      .to('.wallet', { scale: 1.04, duration: .18, yoyo: true, repeat: 1,
                       ease: 'power2.out' }, BEATS.out2 + .68)
      .fromTo('.f-o2', { autoAlpha: 0, y: 12 },
                       { autoAlpha: 1, y: 0, duration: .32, ease: 'settle' }, BEATS.out2 + .66)
      .to('.f-o2', { autoAlpha: 0, y: -18, duration: .35, ease: 'power2.in' }, BEATS.out2 + 1.2);

    /* CLÍMAX — el saldo ya no dice nada */
    tl.to('.bal', { opacity: .25, duration: .12, yoyo: true, repeat: 3,
                    ease: 'none' }, BEATS.blur)
      .call(() => { bal.textContent = 'S/ ?'; }, null, BEATS.blur + .5)
      .to('.bal', { fill: '#FFB020', duration: .3 }, BEATS.blur + .5)
      .to('.box', { x: 3, duration: .07, yoyo: true, repeat: 3,
                    ease: 'none' }, BEATS.blur + .52);

    /* SALIDA */
    tl.to('.lb1, .lb2', { autoAlpha: 0, y: 10, duration: .26, ease: 'swift' }, BEATS.exit)
      .to('.wallet', { autoAlpha: 0, scale: .93, duration: .3, ease: 'swift' }, BEATS.exit + .04)
      .to('.box', { autoAlpha: 0, scale: .95, y: -10,
                    duration: .34, ease: 'swift' }, BEATS.exit + .1);
  }
});
</script>
</body>
</html>
