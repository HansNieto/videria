<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>02 — Cuello de botella</title>
<link rel="stylesheet" href="./lib/overlay.css">
</head>
<body>
<!-- Frase 2: "Si nadie puede comprar, pagar, resolver un reclamo o tomar una decisión
     hasta que tú respondas, tienes un problema de dependencia"
     Estilo 3D suave: masa, sin contornos finos. Carriles de 12px, no líneas. -->
<div id="stage" class="s-soft3d">
  <svg class="canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <g class="frame pos-center">
      <g class="module" transform="translate(960,540) scale(2.1)">

        <!-- carriles -->
        <g class="o link l1"><path id="c1" class="rail" d="M-192,-94 C-150,-94 -110,-60 -65,-32"/></g>
        <g class="o link l2"><path id="c2" class="rail" d="M-192,94 C-150,94 -110,60 -65,32"/></g>
        <g class="o link l3"><path id="c3" class="rail" d="M192,-94 C150,-94 110,-60 65,-32"/></g>
        <g class="o link l4"><path id="c4" class="rail" d="M192,94 C150,94 110,60 65,32"/></g>

        <!-- nodo central: el dueño -->
        <g class="at" transform="translate(0,0)">
          <g class="o hub">
            <circle class="solid accent" r="72"/>
            <circle class="solid warn hubAlert" r="72"/>
            <ellipse class="spec" cx="-20" cy="-26" rx="30" ry="19"/>
            <circle class="solid" cx="0" cy="-14" r="14"/>
            <path class="solid" d="M-23,27 V19 A23,23 0 0 1 23,19 V27 Z"/>
          </g>
        </g>

        <!-- 1 · comprar -->
        <g class="at" transform="translate(-235,-115)">
          <g class="o node n1">
            <circle class="solid glass" r="48"/>
            <ellipse class="spec" cx="-14" cy="-18" rx="22" ry="14"/>
            <path class="solid" d="M-16,-5 h32 l-4,29 h-24 Z"/>
            <path class="st" d="M-8,-5 v-7 a8,8 0 0 1 16,0 v7"/>
          </g>
        </g>

        <!-- 2 · pagar -->
        <g class="at" transform="translate(-235,115)">
          <g class="o node n2">
            <circle class="solid glass" r="48"/>
            <ellipse class="spec" cx="-14" cy="-18" rx="22" ry="14"/>
            <circle class="solid gold" r="22"/>
            <text class="tag t-ink" y="7" text-anchor="middle" style="font-size:20px">S/</text>
          </g>
        </g>

        <!-- 3 · reclamo -->
        <g class="at" transform="translate(235,-115)">
          <g class="o node n3">
            <circle class="solid glass" r="48"/>
            <ellipse class="spec" cx="-14" cy="-18" rx="22" ry="14"/>
            <path class="solid" d="M-22,-18 h44 a8,8 0 0 1 8,8 v14 a8,8 0 0 1 -8,8 h-24
                                    l-12,11 v-11 h-8 a8,8 0 0 1 -8,-8 v-14 a8,8 0 0 1 8,-8 Z"/>
            <path class="st t-ink" d="M-12,-6 h24 M-12,3 h14" stroke="#0B1220"
                  style="stroke:#0B1220;stroke-width:3.4"/>
          </g>
        </g>

        <!-- 4 · decisión -->
        <g class="at" transform="translate(235,115)">
          <g class="o node n4">
            <circle class="solid glass" r="48"/>
            <ellipse class="spec" cx="-14" cy="-18" rx="22" ry="14"/>
            <path class="st hero" d="M0,21 V-2 M0,-2 L-16,-18 M0,-2 L16,-18"
                  style="stroke-width:6"/>
            <circle class="solid" cx="-16" cy="-18" r="6"/>
            <circle class="solid" cx="16" cy="-18" r="6"/>
          </g>
        </g>

        <!-- pulsos -->
        <g class="o p p1"><circle class="solid accent" r="11"/><circle class="solid warn pw" r="11"/></g>
        <g class="o p p2"><circle class="solid accent" r="11"/><circle class="solid warn pw" r="11"/></g>
        <g class="o p p3"><circle class="solid accent" r="11"/><circle class="solid warn pw" r="11"/></g>
        <g class="o p p4"><circle class="solid accent" r="11"/><circle class="solid warn pw" r="11"/></g>

      </g>
    </g>
  </svg>
</div>

<script src="./lib/gsap.min.js"></script>
<script src="./lib/CustomEase.min.js"></script>
<script src="./lib/DrawSVGPlugin.min.js"></script>
<script src="./lib/MotionPathPlugin.min.js"></script>
<script src="./lib/overlay.js"></script>
<script>
/* Entra en "puede" · sale tras "respondas" */
const BEATS = {
  in:    0.00,   // "puede"
  n1:    0.38,   // "comprar"
  n2:    0.77,   // "pagar"
  n3:    1.92,   // "reclamo"
  n4:    3.30,   // "decisión"
  pile:  4.30,   // "hasta que tú"      ← todo vuelve a salir hacia el centro
  block: 4.90,   // "respondas"         ← nadie responde: los flujos se detienen
  exit:  5.40
};

Overlay.scene({
  id: '02_cuello_de_botella',
  build(tl) {
    gsap.set('.o', { autoAlpha: 0 });
    gsap.set('.p', { autoAlpha: 0 });
    gsap.set('.hubAlert, .pw', { autoAlpha: 0 });

    /* el nodo central se establece primero */
    tl.fromTo('.hub', { autoAlpha: 0, scale: .78 },
                      { autoAlpha: 1, scale: 1, duration: .55, ease: 'settle' }, BEATS.in);

    /* cada operación entra con su palabra, abre su carril y manda un pulso */
    [['n1','l1','#c1','p1',BEATS.n1],
     ['n2','l2','#c2','p2',BEATS.n2],
     ['n3','l3','#c3','p3',BEATS.n3],
     ['n4','l4','#c4','p4',BEATS.n4]].forEach(([n, l, c, p, t]) => {
      tl.fromTo('.' + n, { autoAlpha: 0, scale: .7 },
                         { autoAlpha: 1, scale: 1, duration: .42, ease: 'settle' }, t)
        .set('.' + l, { autoAlpha: 1 }, t + .1)
        .fromTo(c, { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: .45,
                                           ease: 'power2.inOut' }, t + .1)
        .fromTo('.' + p, { autoAlpha: 0 }, { autoAlpha: 1, duration: .12 }, t + .22)
        .to('.' + p, { motionPath: { path: c, align: c, alignOrigin: [.5, .5] },
                       duration: .62, ease: 'power1.in' }, t + .22)
        .to('.' + p, { autoAlpha: 0, scale: .5, duration: .14 }, t + .78)
        .to('.hub', { scale: 1.035, duration: .16, yoyo: true, repeat: 1,
                      ease: 'power2.out' }, t + .8);
     });

    /* todo sale a la vez hacia el centro… */
    tl.set('.p', { scale: 1 }, BEATS.pile)
      .fromTo('.p', { autoAlpha: 0 }, { autoAlpha: 1, duration: .12 }, BEATS.pile)
      .to('.p1', { motionPath: { path: '#c1', align: '#c1', alignOrigin: [.5,.5], end: .62 },
                   duration: .55, ease: 'power2.out' }, BEATS.pile)
      .to('.p2', { motionPath: { path: '#c2', align: '#c2', alignOrigin: [.5,.5], end: .62 },
                   duration: .55, ease: 'power2.out' }, BEATS.pile + .05)
      .to('.p3', { motionPath: { path: '#c3', align: '#c3', alignOrigin: [.5,.5], end: .62 },
                   duration: .55, ease: 'power2.out' }, BEATS.pile + .1)
      .to('.p4', { motionPath: { path: '#c4', align: '#c4', alignOrigin: [.5,.5], end: .62 },
                   duration: .55, ease: 'power2.out' }, BEATS.pile + .15);

    /* …y se queda atascado: nadie responde */
    tl.to('.rail', { stroke: 'rgba(255,255,255,.10)', strokeDasharray: '10 26',
                     duration: .3 }, BEATS.block)
      .to('.hubAlert', { autoAlpha: 1, duration: .35 }, BEATS.block)
      .to('.pw', { autoAlpha: 1, duration: .25 }, BEATS.block)
      .to('.p', { scale: 1.45, duration: .3, ease: 'settle', stagger: .04 }, BEATS.block)
      .to('.node', { autoAlpha: .38, duration: .35 }, BEATS.block + .05)
      .to('.hub', { x: 4, duration: .07, yoyo: true, repeat: 3, ease: 'none' }, BEATS.block + .1);

    /* salida: se comprime hacia el atasco */
    tl.to('.p',    { autoAlpha: 0, scale: .7, duration: .26, ease: 'swift' }, BEATS.exit)
      .to('.link', { autoAlpha: 0, duration: .26, ease: 'swift' }, BEATS.exit + .04)
      .to('.node', { autoAlpha: 0, scale: .82, duration: .3, ease: 'swift',
                     stagger: .04 }, BEATS.exit + .06)
      .to('.hub',  { autoAlpha: 0, scale: .88, duration: .32, ease: 'swift' }, BEATS.exit + .14);
  }
});
</script>
</body>
</html>
