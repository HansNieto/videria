<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>05 — Del celular al repositorio</title>
<link rel="stylesheet" href="./lib/overlay.css">
</head>
<body>
<!-- Frase 5: "…asegúrate de que las cuentas, proveedores y archivos necesarios
     no existan solamente en tu celular."
     Estilo 3D suave: teléfono y repositorio de masa, conexiones de 12px. -->
<div id="stage" class="s-soft3d">
  <svg class="canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <g class="frame pos-center">
      <g class="module" transform="translate(960,615) scale(2.2)">

        <!-- celular -->
        <g class="at" transform="translate(-175,0) scale(1.25)">
          <g class="o phone">
            <rect class="solid" x="-44" y="-78" width="88" height="156" rx="16"/>
            <rect class="solid dark" x="-35" y="-66" width="70" height="122" rx="8"/>
            <ellipse class="spec" cx="-16" cy="-56" rx="18" ry="10"/>
            <rect class="solid" x="-11" y="64" width="22" height="6" rx="3"/>
            <rect class="phoneRing" x="-50" y="-84" width="100" height="168" rx="21"/>
          </g>
        </g>

        <!-- candado: todo vive solo aquí -->
        <g class="at" transform="translate(-175,-150)">
          <g class="o lock">
            <rect class="solid warn" x="-21" y="-4" width="42" height="32" rx="8"/>
            <path class="lockarc" d="M-11,-4 V-15 a11,11 0 0 1 22,0 V-4"/>
            <ellipse class="spec" cx="-7" cy="4" rx="9" ry="6"/>
          </g>
        </g>

        <!-- repositorio compartido -->
        <g class="at" transform="translate(150,0) scale(1.25)">
          <g class="o repo">
            <path class="solid glass repoBody" d="M-46,-38 V34 a46,15 0 0 0 92,0 V-38 Z"/>
            <ellipse class="solid repoTop" cx="0" cy="-38" rx="46" ry="15"/>
            <path class="solid ok repoOn" d="M-46,-38 V34 a46,15 0 0 0 92,0 V-38 Z"/>
            <ellipse class="solid ok repoOnTop" cx="0" cy="-38" rx="46" ry="15"/>
            <ellipse class="spec" cx="-16" cy="-40" rx="20" ry="7"/>
          </g>
        </g>

        <!-- accesos del equipo -->
        <g class="at" transform="translate(290,-66)">
          <g class="o acc a1">
            <path class="rail ln" d="M-82,66 C-64,66 -48,0 -19,0"/>
            <circle class="solid" cx="0" cy="-14" r="12"/>
            <path class="solid" d="M-19,17 V11 A19,19 0 0 1 19,11 V17 Z"/>
          </g>
        </g>
        <g class="at" transform="translate(290,0)">
          <g class="o acc a2">
            <path class="rail ln" d="M-82,0 H-19"/>
            <circle class="solid" cx="0" cy="-14" r="12"/>
            <path class="solid" d="M-19,17 V11 A19,19 0 0 1 19,11 V17 Z"/>
          </g>
        </g>
        <g class="at" transform="translate(290,66)">
          <g class="o acc a3">
            <path class="rail ln" d="M-82,-66 C-64,-66 -48,0 -19,0"/>
            <circle class="solid" cx="0" cy="-14" r="12"/>
            <path class="solid" d="M-19,17 V11 A19,19 0 0 1 19,11 V17 Z"/>
          </g>
        </g>

        <!-- 1 · cuentas (una contraseña) -->
        <g class="at" transform="translate(-175,-50) scale(1.15)">
          <g class="o it it1">
            <rect class="solid" x="-15" y="-3" width="30" height="24" rx="7"/>
            <path class="keyarc" d="M-8,-3 V-11 a8,8 0 0 1 16,0 V-3"/>
          </g>
        </g>
        <!-- 2 · proveedores (una caja) -->
        <g class="at" transform="translate(-175,0) scale(1.15)">
          <g class="o it it2">
            <path class="solid" d="M-16,-9 L0,-18 L16,-9 L0,0 Z"/>
            <path class="solid glass" d="M-16,-9 L0,0 L0,18 L-16,9 Z"/>
            <path class="solid glass" d="M16,-9 L0,0 L0,18 L16,9 Z"/>
          </g>
        </g>
        <!-- 3 · archivos (un documento) -->
        <g class="at" transform="translate(-175,50) scale(1.15)">
          <g class="o it it3">
            <path class="solid" d="M-13,-17 H4 L13,-8 V17 H-13 Z"/>
            <path class="docfold" d="M4,-17 V-8 H13"/>
          </g>
        </g>

      </g>
    </g>
  </svg>
</div>

<style>
  .phoneRing { fill: none; stroke: #FFB020; stroke-width: 8; }
  .lockarc   { fill: none; stroke: #E9A21A; stroke-width: 7; stroke-linecap: round; }
  .keyarc    { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round; }
  .docfold   { fill: none; stroke: rgba(11,18,32,.45); stroke-width: 3.5;
               stroke-linejoin: round; }
</style>

<script src="./lib/gsap.min.js"></script>
<script src="./lib/CustomEase.min.js"></script>
<script src="./lib/DrawSVGPlugin.min.js"></script>
<script src="./lib/overlay.js"></script>
<script>
/* Entra en "las" · sale ~0,6 s después de "celular" */
const BEATS = {
  in:   0.00,   // "las"
  i1:   0.39,   // "cuentas"
  i2:   0.77,   // "proveedores"
  i3:   1.54,   // "archivos necesarios"
  lock: 3.08,   // "solamente"          ← todo encerrado en un solo sitio
  free: 4.00,   // "en tu celular"      ← sale del teléfono
  team: 5.05,   // el equipo entra
  exit: 5.42
};

Overlay.scene({
  id: '05_del_celular_al_repositorio',
  build(tl) {
    gsap.set('.o', { autoAlpha: 0 });
    gsap.set('.phoneRing, .repoOn, .repoOnTop', { autoAlpha: 0 });

    /* ENTRADA — el teléfono y lo que vive dentro */
    tl.fromTo('.phone', { autoAlpha: 0, y: 20, scale: .94 },
                        { autoAlpha: 1, y: 0, scale: 1, duration: .55 }, BEATS.in)
      .fromTo('.it1', { autoAlpha: 0, scale: .6 },
                      { autoAlpha: 1, scale: 1, duration: .4, ease: 'settle' }, BEATS.i1)
      .fromTo('.it2', { autoAlpha: 0, scale: .6 },
                      { autoAlpha: 1, scale: 1, duration: .4, ease: 'settle' }, BEATS.i2)
      .fromTo('.it3', { autoAlpha: 0, scale: .6 },
                      { autoAlpha: 1, scale: 1, duration: .4, ease: 'settle' }, BEATS.i3);

    /* CLÍMAX NEGATIVO — solo existe aquí */
    tl.fromTo('.lock', { autoAlpha: 0, y: 12, scale: .7 },
                       { autoAlpha: 1, y: 0, scale: 1, duration: .42, ease: 'settle' }, BEATS.lock)
      .to('.phoneRing', { autoAlpha: 1, duration: .35 }, BEATS.lock)
      .to('.phone', { x: 4, duration: .07, yoyo: true, repeat: 3,
                      ease: 'none' }, BEATS.lock + .25);

    /* GIRO — la información sale del teléfono hacia el repositorio */
    tl.to('.lock', { autoAlpha: 0, y: -16, scale: .7, rotation: -8,
                     duration: .3, ease: 'swift' }, BEATS.free)
      .to('.phoneRing', { autoAlpha: 0, duration: .35 }, BEATS.free)
      .fromTo('.repo', { autoAlpha: 0, scale: .88, y: 14 },
                       { autoAlpha: 1, scale: 1, y: 0, duration: .5, ease: 'settle' }, BEATS.free);

    [['it1', 50, 140, BEATS.free + .10],
     ['it2', 0,  175, BEATS.free + .24],
     ['it3', -50, 205, BEATS.free + .38]].forEach(([it, dy, mx, t]) => {
      tl.to('.' + it, { keyframes: [
              { x: mx, y: dy / 2 - 128, scale: 1.06, duration: .38, ease: 'power2.out' },
              { x: 325, y: dy, scale: .48, duration: .42, ease: "power2.in" }
            ] }, t)
        .to('.' + it, { autoAlpha: 0, duration: .16 }, t + .68)
        .to('.repo', { scale: 1.05, duration: .18, yoyo: true, repeat: 1,
                       ease: 'power2.out' }, t + .74);
    });

    /* RESOLUCIÓN — el equipo puede entrar */
    tl.to('.repoOn, .repoOnTop', { autoAlpha: 1, duration: .4 }, BEATS.team)
      .fromTo('.acc', { autoAlpha: 0, x: 18 },
                      { autoAlpha: 1, x: 0, duration: .4, ease: 'brand',
                        stagger: .09 }, BEATS.team)
      .fromTo('.acc .ln', { drawSVG: '100% 100%' },
                          { drawSVG: '0% 100%', duration: .36, ease: 'power2.out',
                            stagger: .09 }, BEATS.team + .06);

    /* SALIDA — el sistema resuelto se contrae */
    tl.to('.acc',   { autoAlpha: 0, x: 14, duration: .28, ease: 'swift',
                      stagger: .04 }, BEATS.exit)
      .to('.repo',  { autoAlpha: 0, scale: .9, duration: .32, ease: 'swift' }, BEATS.exit + .1)
      .to('.phone', { autoAlpha: 0, scale: .93, y: 10,
                      duration: .32, ease: 'swift' }, BEATS.exit + .14);
  }
});
</script>
</body>
</html>
