<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NN — concepto</title>
<link rel="stylesheet" href="./lib/overlay.css">
</head>
<body>

<!-- ==========================================================================
     Lienzo 1920x1080. Fondo transparente (overlay para CapCut).

     ESTRUCTURA OBLIGATORIA
     .frame  → encuadre: pos-center / pos-left / pos-right / pos-top / pos-bottom
     .module → transform="translate(960,540)". NO se anima.
     .at     → grupo de COLOCACIÓN: lleva el translate. NO se anima.
     .o      → grupo ANIMADO, siempre dentro de .at y SIN transform propio.

     Motivo: GSAP convierte el atributo transform en sus propios x/y, así que
     animar y: sobre un grupo colocado con translate(0,152) lo manda a y=0.
     Colocación fuera, animación dentro. Siempre.

     GROSOR DE TRAZO
     Nunca escribas stroke-width. El grosor lo ponen --sw / --sw-thin / --sw-hero
     (clases .st / .st.thin / .st.hero), declarados en px del LIENZO 1920. Si el
     módulo lleva scale(...), overlay.js lo mide y lo compensa: el número
     declarado es el que se renderiza. Si una pieza necesita grosor propio:
     stroke-width: calc(9 / var(--mscale)). Ver references/design-system.md §2.
     ========================================================================== -->
<div id="stage">
  <svg class="canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <g class="frame pos-center">
      <g class="module" transform="translate(960,540)">

        <!-- ============ ESCENA ============ -->
        <g class="at" transform="translate(0,0)">
          <g class="o card">
            <rect class="st" x="-150" y="-100" width="300" height="200" rx="22"/>
            <path class="st dim" d="M-100,-30 H60 M-100,10 H10"/>
          </g>
        </g>

        <g class="at" transform="translate(150,-100)">
          <g class="o mark">
            <circle class="st c-ok" r="30" fill="var(--fill-ok)"/>
            <path class="st c-ok" d="M-12,1 L-3,10 L13,-9"/>
          </g>
        </g>

        <g class="at" transform="translate(0,152)">
          <g class="o label">
            <text class="tag" text-anchor="middle">ETIQUETA</text>
          </g>
        </g>
        <!-- ============ /ESCENA ============ -->

      </g>
    </g>
  </svg>
</div>

<script src="./lib/gsap.min.js"></script>
<script src="./lib/CustomEase.min.js"></script>
<script src="./lib/DrawSVGPlugin.min.js"></script>
<script src="./lib/MotionPathPlugin.min.js"></script>
<script src="./lib/MorphSVGPlugin.min.js"></script>
<script src="./lib/overlay.js"></script>
<script>
/* Tiempos anclados a la narración (palabras / 2.6 = segundos).
   Anota la palabra exacta de cada beat: es lo que se entrega en el README. */
const BEATS = {
  in:    0.00,   // palabra: "…"
  main:  1.10,   // palabra: "…"   ← momento principal
  hold:  2.20,   // pausa semántica: no entra nada nuevo
  exit:  3.10
};

Overlay.scene({
  id: 'NN_concepto',
  BEATS,
  build(tl, ctx) {
    const { q, qa } = ctx;

    /* Estado inicial explícito: garantiza t=0 vacío y un loop limpio. */
    gsap.set('.o', { autoAlpha: 0 });

    /* ---- ENTRADA ---- */
    tl.fromTo('.card',
        { autoAlpha: 0, yPercent: 6, scale: .96 },
        { autoAlpha: 1, yPercent: 0, scale: 1, duration: .55, ease: 'brand' }, BEATS.in)
      .fromTo('.label',
        { autoAlpha: 0, y: 10 },
        { autoAlpha: 1, y: 0, duration: .4, ease: 'brand' }, BEATS.in + .12);

    /* ---- DESARROLLO / momento principal ---- */
    tl.fromTo('.mark',
        { autoAlpha: 0, scale: .5 },
        { autoAlpha: 1, scale: 1, duration: .45, ease: 'settle' }, BEATS.main)
      .to('.card', { scale: 1.02, duration: .18, yoyo: true, repeat: 1,
                     ease: 'power2.out' }, BEATS.main + .05);

    /* ---- PAUSA (respeta el ritmo de la narración) ---- */
    tl.to({}, { duration: .01 }, BEATS.hold);

    /* ---- SALIDA (más rápida que la entrada, con intención) ---- */
    tl.to('.mark',  { autoAlpha: 0, scale: .9, duration: .25, ease: 'swift' }, BEATS.exit)
      .to('.label', { autoAlpha: 0, y: -8, duration: .28, ease: 'swift' }, BEATS.exit + .04)
      .to('.card',  { autoAlpha: 0, scale: .97, duration: .34, ease: 'swift' }, BEATS.exit + .08);
  }
});
</script>
</body>
</html>
