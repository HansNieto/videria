<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NN — flujo visual</title>
<link rel="stylesheet" href="./lib/overlay.css">
</head>
<body>

<!-- Plantilla Videria: 1080×1920 vertical, fondo transparente.
     Cambia los actores y la metáfora, no reduzcas esta escena a un icono aislado.

     .module → colocación global; NO se anima.
     .at     → colocación local; NO se anima.
     .o      → objeto animado; no lleva transform de colocación.

     No escribas stroke-width: usa .st / .thin / .hero. -->
<div id="stage" class="s-neon">
  <svg class="canvas" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <g class="frame pos-center">
      <!-- El gráfico ocupa el tercio superior y deja libre al presentador. -->
      <g class="module" transform="translate(540,500)">

        <!-- Rutas causales: curvas, cercanas y con dirección. -->
        <g class="o route-top">
          <path id="routeTop" class="route" d="M-190,-120 C-85,-285,85,-300,155,-226"/>
          <path class="st hero c-accent" d="M130,-242 L160,-224 L143,-194"/>
        </g>
        <g class="o route-right">
          <path id="routeRight" class="route dash" d="M270,-115 C330,-26,331,74,278,132"/>
          <path class="st c-accent" d="M296,116 L276,140 L252,119"/>
        </g>
        <g class="o route-bottom">
          <path id="routeBottom" class="route" d="M152,222 C30,318,-124,303,-190,231"/>
          <path class="st hero c-accent" d="M-164,246 L-198,226 L-177,197"/>
        </g>
        <g class="o route-left">
          <path id="routeLeft" class="route dash" d="M-292,137 C-341,54,-331,-35,-282,-94"/>
          <path class="st c-accent" d="M-304,-76 L-278,-101 L-257,-75"/>
        </g>

        <!-- 1. Mensaje / solicitud -->
        <g class="at" transform="translate(-285,-145)">
          <g class="o node-message neon-cyan">
            <path class="glass-panel" d="M-142,-72 H118 Q146,-72 146,-44 V39 Q146,67 118,67 H-44 L-83,103 L-77,67 H-142 Q-170,67 -170,39 V-44 Q-170,-72 -142,-72 Z"/>
            <path class="st thin" d="M-118,-25 H86 M-118,11 H58"/>
          </g>
        </g>

        <!-- 2. Persona / cliente con duda -->
        <g class="at" transform="translate(228,-190)">
          <g class="o node-person neon-blue">
            <circle class="soft-halo" r="128"/>
            <circle class="st hero c-accent f-accent" r="92"/>
            <circle class="st" cy="-24" r="27"/>
            <path class="st" d="M-49,53 V38 Q-49,4 0,4 Q49,4 49,38 V53 Z"/>
          </g>
        </g>
        <g class="at" transform="translate(338,-276)">
          <g class="o node-question neon-cyan">
            <path class="glass-panel" d="M-44,-52 H28 Q55,-52 55,-25 V18 Q55,45 28,45 H4 L-17,69 L-14,45 H-44 Q-69,45 -69,18 V-25 Q-69,-52 -44,-52 Z"/>
            <text class="num sm t-accent" x="-7" y="20" text-anchor="middle">?</text>
          </g>
        </g>

        <!-- 3. Precio / decisión -->
        <g class="at" transform="translate(-250,190)">
          <g class="o node-price neon-blue">
            <rect class="glass-panel" x="-128" y="-70" width="256" height="140" rx="36"/>
            <rect class="st hero c-accent f-accent" x="-115" y="-57" width="230" height="114" rx="29"/>
            <text class="num sm" x="-12" y="20" text-anchor="middle">S/</text>
            <text class="num sm t-accent" x="71" y="20" text-anchor="middle">?</text>
          </g>
        </g>

        <!-- 4. Resultado negativo -->
        <g class="at" transform="translate(238,190)">
          <g class="o node-error neon-red">
            <circle class="soft-danger" r="132"/>
            <circle class="ring-dash" r="105"/>
            <circle class="st hero c-bad f-bad" r="84"/>
            <path class="st hero c-bad" d="M-34,-34 L34,34 M34,-34 L-34,34"/>
          </g>
        </g>

        <!-- Pulsos: movimiento que explica la relación, no decoración. -->
        <g class="o pulses">
          <circle class="dot accent pulse-top" r="11"/>
          <circle class="dot accent pulse-bottom" r="11"/>
        </g>
      </g>
    </g>
  </svg>
</div>

<script src="./lib/gsap.min.js"></script>
<script src="./lib/CustomEase.min.js"></script>
<script src="./lib/DrawSVGPlugin.min.js"></script>
<script src="./lib/MotionPathPlugin.min.js"></script>
<script src="./lib/MorphSVGPlugin.min.js"></script>
<script src="./lib/overlay.js"></script>
<script>
/* Sustituye las palabras ancla por las de la narración real. */
const BEATS = {
  in:       0.00, // palabra: "…"
  actor:    0.48, // palabra: "…"
  decision: 1.18, // palabra: "…"
  result:   2.02, // palabra: "…"
  hold:     3.25,
  exit:     3.88
};

Overlay.scene({
  id: 'NN_flujo_visual',
  style: 's-neon',
  BEATS,
  build(tl) {
    gsap.set('.o', { autoAlpha: 0 });
    gsap.set('.route-top path:first-child, .route-bottom path:first-child', { drawSVG: '0%' });

    tl.fromTo('.node-message',
        { autoAlpha: 0, scale: .82, y: 22 },
        { autoAlpha: 1, scale: 1, y: 0, duration: .58, ease: 'settle' }, BEATS.in)
      .fromTo('.node-person',
        { autoAlpha: 0, scale: .74, x: 22 },
        { autoAlpha: 1, scale: 1, x: 0, duration: .55, ease: 'settle' }, BEATS.actor)
      .fromTo('.node-question',
        { autoAlpha: 0, scale: .45, y: 12 },
        { autoAlpha: 1, scale: 1, y: 0, duration: .42, ease: 'settle' }, BEATS.actor + .18)
      .to('.route-top', { autoAlpha: 1, duration: .01 }, BEATS.actor - .08)
      .to('.route-top path:first-child', { drawSVG: '100%', duration: .58, ease: 'power2.inOut' }, BEATS.actor - .08)
      .fromTo('.node-price',
        { autoAlpha: 0, scale: .78, x: -18 },
        { autoAlpha: 1, scale: 1, x: 0, duration: .52, ease: 'settle' }, BEATS.decision)
      .fromTo('.route-left',
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: .38, ease: 'brand' }, BEATS.decision + .12)
      .fromTo('.node-error',
        { autoAlpha: 0, scale: .52, rotation: -8 },
        { autoAlpha: 1, scale: 1, rotation: 0, duration: .52, ease: 'settle' }, BEATS.result)
      .to('.route-right', { autoAlpha: 1, duration: .35, ease: 'brand' }, BEATS.result - .20)
      .to('.route-bottom', { autoAlpha: 1, duration: .01 }, BEATS.result + .06)
      .to('.route-bottom path:first-child', { drawSVG: '100%', duration: .62, ease: 'power2.inOut' }, BEATS.result + .06)
      .fromTo('.pulses', { autoAlpha: 0 }, { autoAlpha: 1, duration: .15 }, BEATS.result + .14)
      .fromTo('.pulse-top',
        { motionPath: { path: '#routeTop', align: '#routeTop', alignOrigin: [0.5, 0.5], start: 0, end: 0 } },
        { motionPath: { path: '#routeTop', align: '#routeTop', alignOrigin: [0.5, 0.5], start: 0, end: 1 }, duration: .9, ease: 'power2.inOut' }, BEATS.result + .15)
      .fromTo('.pulse-bottom',
        { motionPath: { path: '#routeBottom', align: '#routeBottom', alignOrigin: [0.5, 0.5], start: 0, end: 0 } },
        { motionPath: { path: '#routeBottom', align: '#routeBottom', alignOrigin: [0.5, 0.5], start: 0, end: 1 }, duration: .9, ease: 'power2.inOut' }, BEATS.result + .35)
      .to('.node-error', { scale: 1.07, duration: .18, yoyo: true, repeat: 1, ease: 'power2.out' }, BEATS.result + .52)
      .to({}, { duration: .01 }, BEATS.hold)
      .to('.o', { autoAlpha: 0, scale: .96, duration: .36, stagger: .025, ease: 'swift' }, BEATS.exit);
  }
});
</script>
</body>
</html>
