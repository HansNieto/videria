name: Studio and desktop regressions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Flask==3.1.3 numpy==2.5.2 Pillow==12.3.0
      - run: python -m unittest discover -s tests -v
      - run: node tests/player_startup.test.cjs
      - run: node tests/timeline_free.test.cjs
      - run: node tests/color_controls.test.cjs
